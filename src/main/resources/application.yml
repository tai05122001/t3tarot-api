spring:
  application:
    name: t3tarot-api
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:100ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:200ms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 3000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [%X{requestId:-}] %logger{36} - %msg%n"

t3tarot:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
      excluded-paths: /auth/email/verify-page
    jwt:
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}
      public-key: ${JWT_PUBLIC_KEY:}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
    swagger-public: ${SWAGGER_ENABLED:false}
    public-paths:
      - /auth/register
      - /auth/login
      - /auth/social/google
      - /auth/refresh
      - /auth/logout
      - /auth/email/verify
      - /auth/email/verify-page
      - /auth/email/resend
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      public-limit:
        max-requests: ${RATE_LIMIT_PUBLIC_MAX_REQUESTS:10}
        window-seconds: ${RATE_LIMIT_PUBLIC_WINDOW_SECONDS:60}
      authenticated-limit:
        max-requests: ${RATE_LIMIT_AUTHENTICATED_MAX_REQUESTS:120}
        window-seconds: ${RATE_LIMIT_AUTHENTICATED_WINDOW_SECONDS:60}
  verification-mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:T3Tarot}
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
    web-base-url: ${APP_WEB_BASE_URL:http://localhost:5173}
    web-login-path: ${APP_WEB_LOGIN_PATH:/login}
    web-resend-path: ${APP_WEB_RESEND_PATH:/verify-email}
    web-home-path: ${APP_WEB_HOME_PATH:/}
    async:
      enabled: ${MAIL_ASYNC_ENABLED:true}
      pool-size: ${MAIL_ASYNC_POOL_SIZE:4}
      queue-capacity: ${MAIL_ASYNC_QUEUE_CAPACITY:200}
      shutdown-await: ${MAIL_ASYNC_SHUTDOWN_AWAIT:10s}
  identity:
    private-key: ${JWT_PRIVATE_KEY:}
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
    key-id: ${JWT_KEY_ID:t3tarot-1}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
    refresh-grace: ${AUTH_REFRESH_GRACE:10s}
    google:
      client-ids: ${GOOGLE_CLIENT_IDS:}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
