<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title th:text="${title}">T3Tarot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=Cormorant+Garamond:wght@500;600&amp;display=swap">
<style>
:root{--bg:#141B2E;--surface:#1E2741;--text:#F3EEDF;--muted:#B4B9CC;--accent:#E3B23C;--danger:#F08A6B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,sans-serif}
.page{min-height:100vh;min-height:100dvh;max-width:480px;margin:0 auto;padding:24px 24px 32px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:600}
.content{flex-grow:1;display:flex;flex-direction:column;justify-content:center;gap:28px;text-align:center}
.icon{display:flex;justify-content:center}
.heading{display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:36px;line-height:1.1}
p{margin:0;font-size:16px;line-height:1.55;color:var(--muted)}
form{margin:0}
.button{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--accent);color:var(--bg);font:600 16px 'Be Vietnam Pro',system-ui,sans-serif;text-decoration:none;cursor:pointer}
.button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:14px;line-height:1.5;text-align:center}
</style>
</head>
<body>
<div class="brand" th:fragment="brand">
<svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#E3B23C" stroke-width="1.5" aria-hidden="true"><rect x="6" y="2" width="16" height="24" rx="2.5"></rect><circle cx="14" cy="14" r="3.5"></circle><path d="M14 7.5v2M14 18.5v2M7.5 14h2M18.5 14h2"></path></svg>
<span>T3Tarot</span>
</div>
</body>
</html>
