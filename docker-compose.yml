services:
  postgres:
    build:
      context: ./docker/postgres
      args:
        POSTGRES_VERSION: ${DB_IMAGE_VERSION:-17}
    image: t3tarot-postgres:${DB_IMAGE_VERSION:-17}
    container_name: t3tarot-postgres
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - timezone=${DB_TIMEZONE:-UTC}
      - -c
      - log_min_duration_statement=${DB_SLOW_QUERY_MS:-500}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - t3tarot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:${REDIS_IMAGE_VERSION:-7.4}-alpine
    container_name: t3tarot-redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAX_MEMORY:-128mb}
      - --maxmemory-policy
      - volatile-ttl
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  t3tarot-pgdata:
